<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>EFAD Attendance Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Public+Sans:wght@400;500;600;700&display=swap');

  :root {
    --ink: #00416A;
    --ink-soft: #1F3C4D;
    --muted: #5C7386;
    --bg: #F5F7F8;
    --surface: #FFFFFF;
    --border: #DCE3E7;
    --accent: #FF7518;
    --accent-soft: #FFE3C7;
    --present: #2F7A54;
    --present-soft: #DCEEE3;
    --absent: #C0392B;
    --absent-soft: #F6DBD6;
    --excused: #B8862E;
    --excused-soft: #F1E4C6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink-soft); font-family: 'Public Sans', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  h1, h2, h3, .serif { font-family: 'Lora', Georgia, serif; margin: 0; }
  a { color: inherit; }
  .muted { color: var(--muted); }
  .ink { color: var(--ink); }
  button, input, select, textarea { font-family: inherit; font-size: 14px; }

  /* Layout */
  .layout { display: flex; flex-direction: column; min-height: 100vh; }
  @media (min-width: 768px) { .layout { flex-direction: row; } }
  .sidebar { background: var(--surface); border-bottom: 1px solid var(--border); }
  @media (min-width: 768px) { .sidebar { width: 240px; min-height: 100vh; border-bottom: none; border-right: 1px solid var(--border); display: flex; flex-direction: column; } }
  .brand { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .brand-name { font-size: 17px; font-weight: 600; color: var(--ink); line-height: 1.1; }
  .brand-sub { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .navlinks { display: flex; gap: 4px; padding: 10px; flex: 1; }
  @media (min-width: 768px) { .navlinks { flex-direction: column; } }
  .navlink { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 8px; font-size: 14px; font-weight: 500; background: transparent; border: none; color: var(--ink); cursor: pointer; text-align: left; }
  .navlink:hover { background: rgba(0,0,0,0.05); }
  .navlink.active { background: var(--ink); color: #F6F7F1; }
  .signout-wrap { padding: 12px; display: none; }
  @media (min-width: 768px) { .signout-wrap.show { display: block; } }
  .signout { display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 12px; border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--muted); background: transparent; border: none; cursor: pointer; }
  .signout:hover { background: rgba(0,0,0,0.05); }

  .main { flex: 1; min-width: 0; padding: 24px 20px; }
  @media (min-width: 768px) { .main { padding: 32px; } }
  .wrap { max-width: 900px; }
  .wrap-lg { max-width: 1080px; }

  /* Hero */
  .hero { position: relative; border-radius: 16px; overflow: hidden; border: 1px solid var(--border); margin-bottom: 24px; }
  .hero-editable { cursor: pointer; }
  .hero-change-badge { position: absolute; top: 10px; right: 10px; display: flex; align-items: center; gap: 5px; background: rgba(0,0,0,0.45); color: #fff; font-size: 11px; font-weight: 500; padding: 5px 10px; border-radius: 999px; backdrop-filter: blur(2px); }

  /* Dashboard KPI grid */
  .dash-grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 18px; }
  @media (min-width: 640px) { .dash-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1024px) { .dash-grid { grid-template-columns: repeat(3, 1fr); } }
  .dash-card-wide { grid-column: 1 / -1; }
  .kpi-label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; font-weight: 500; }
  .kpi-value { font-size: 28px; font-weight: 700; margin-top: 8px; font-family: 'Lora', Georgia, serif; color: var(--ink); line-height: 1.1; }
  .kpi-sub { font-size: 12px; color: var(--muted); margin-top: 5px; }
  .trend-up { color: var(--present); }
  .trend-down { color: var(--absent); }
  .trend-flat { color: var(--muted); }
  .freq-row { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; }
  .freq-item { text-align: center; flex: 1; padding: 8px 4px; border-radius: 10px; background: rgba(0,0,0,0.03); }
  .freq-num { font-size: 19px; font-weight: 700; color: var(--ink); font-family: 'Lora', Georgia, serif; }
  .freq-label { font-size: 10.5px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.02em; }
  .followup-list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .followup-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--absent-soft); border: none; width: 100%; text-align: left; cursor: pointer; font-family: inherit; }
  .followup-item:hover { filter: brightness(0.97); }
  .followup-name { font-size: 13.5px; font-weight: 600; color: var(--ink); }
  .followup-reason { font-size: 11.5px; color: var(--absent); margin-top: 1px; }
  .followup-ok { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 12px; border-radius: 10px; background: var(--present-soft); color: var(--present); font-size: 13px; font-weight: 500; }

  /* Stories & Updates */
  .story-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 18px; }
  @media (min-width: 640px) { .story-grid { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 1024px) { .story-grid { grid-template-columns: repeat(3, 1fr); } }
  .story-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
  .story-img { width: 100%; height: 160px; object-fit: cover; display: block; background: var(--bg); }
  .story-img-placeholder { display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .story-body { padding: 14px 16px; }
  .story-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .story-title { font-size: 15px; font-weight: 600; color: var(--ink); }
  .story-caption { font-size: 13px; color: var(--ink-soft); margin-top: 6px; line-height: 1.45; white-space: pre-wrap; }
  .story-media { position: relative; }
  .story-zone { position: absolute; top: 0; bottom: 0; border: none; background: transparent; padding: 0; margin: 0; cursor: pointer; display: flex; align-items: center; }
  .story-zone-left { left: 0; width: 24%; justify-content: flex-start; padding-left: 8px; }
  .story-zone-right { right: 0; width: 24%; justify-content: flex-end; padding-right: 8px; }
  .story-zone-center { left: 24%; width: 52%; cursor: zoom-in; }
  .zone-icon { color: #fff; background: rgba(0,0,0,0.42); border-radius: 50%; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; }
  .story-zone-right .zone-icon svg { transform: rotate(180deg); }
  .story-carousel-dots { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; pointer-events: none; }
  .story-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.55); }
  .story-dot.active { background: #fff; }
  .story-carousel-count { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.5); color: #fff; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 999px; pointer-events: none; }
  .lightbox-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 80; display: flex; align-items: center; justify-content: center; }
  .lightbox-img { max-width: 92vw; max-height: 88vh; object-fit: contain; border-radius: 4px; }
  .lightbox-close { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.15); color: #fff; border: none; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .lightbox-close:hover { background: rgba(255,255,255,0.28); }
  .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.15); color: #fff; border: none; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .lightbox-nav:hover { background: rgba(255,255,255,0.28); }
  .lightbox-prev { left: 16px; }
  .lightbox-next { right: 16px; }
  .lightbox-next svg { transform: rotate(180deg); }
  .lightbox-count { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.15); color: #fff; font-size: 12px; padding: 4px 12px; border-radius: 999px; }
  .photo-thumb-wrap { position: relative; display: inline-block; }
  .photo-thumb-remove { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; background: var(--absent); color: #fff; border: none; font-size: 13px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .hero img { width: 100%; height: 170px; object-fit: cover; display: block; }
  @media (min-width: 640px) { .hero img { height: 210px; } }
  .hero-overlay { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,65,106,0.85) 0%, rgba(0,65,106,0.4) 55%, rgba(0,65,106,0.05) 100%); }
  .hero-text { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 20px 24px; }
  .hero-eyebrow { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #FFD9AE; }
  .hero-title { font-size: 21px; font-weight: 600; color: #fff; margin-top: 6px; }
  @media (min-width: 640px) { .hero-title { font-size: 25px; } }
  .hero-sub { font-size: 13px; color: #E4EEF3; margin-top: 6px; max-width: 420px; }

  /* Cards / surfaces */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .empty { margin-top: 24px; border: 1px dashed var(--border); border-radius: 12px; padding: 32px; text-align: center; }

  /* Search */
  .search-wrap { position: relative; max-width: 320px; margin-top: 16px; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .search-wrap input { width: 100%; padding: 10px 12px 10px 34px; border: 1px solid var(--border); border-radius: 8px; outline: none; background: var(--surface); }
  .search-wrap input:focus { box-shadow: 0 0 0 3px rgba(0,65,106,0.15); }

  /* Group grid */
  .group-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 18px; }
  @media (min-width: 640px) { .group-grid { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 1024px) { .group-grid { grid-template-columns: repeat(3, 1fr); } }
  .group-card { text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; cursor: pointer; transition: box-shadow .15s; }
  .group-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
  .group-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .group-name { font-size: 15px; font-weight: 600; color: var(--ink); }
  .group-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 1px solid var(--border); }
  .group-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .pill { font-size: 11px; font-weight: 500; border-radius: 999px; padding: 4px 9px; white-space: nowrap; }
  .pill-accent { background: var(--accent-soft); color: var(--accent); }
  .group-leader { font-size: 13px; color: var(--muted); margin-top: 10px; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 7px; border-radius: 8px; padding: 10px 16px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--ink); color: #F6F7F1; }
  .btn-primary:hover:not(:disabled) { background: #01344F; }
  .btn-accent { background: var(--accent); color: #FFFDF8; }
  .btn-accent:hover:not(:disabled) { background: #E5650D; }
  .btn-ghost { background: var(--surface); border: 1px solid var(--border); color: var(--ink); }
  .btn-ghost:hover:not(:disabled) { background: rgba(0,0,0,0.04); }
  .btn-text { background: none; border: none; color: var(--muted); font-size: 13px; font-weight: 500; cursor: pointer; padding: 4px; }
  .btn-text:hover { color: var(--ink); }
  .btn-sm { padding: 6px 10px; font-size: 12.5px; border-radius: 7px; }

  /* Forms */
  .field { margin-bottom: 0; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
  .field input[type=text], .field input[type=password], .field select, .field textarea, .field input[type=date] {
    width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; outline: none; background: #fff;
  }
  .field input:focus, .field select:focus, .field textarea:focus { box-shadow: 0 0 0 3px rgba(0,65,106,0.15); }
  .field-hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .field-error { font-size: 11px; color: var(--absent); margin-top: 4px; display: flex; align-items: center; gap: 4px; }
  .form-grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 16px; }
  @media (min-width: 640px) { .form-grid { grid-template-columns: 1fr 1fr; } }
  .col-span-2 { grid-column: 1 / -1; }
  .uppercase-input { text-transform: uppercase; }

  /* Group list rows (admin) */
  .group-row { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .group-row-name { font-weight: 600; font-size: 14px; color: var(--ink); }
  .group-row-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .row-actions { display: flex; align-items: center; gap: 6px; }

  /* Attendance */
  .att-header { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .att-meta { font-size: 13px; color: var(--muted); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 14px; }
  .date-picker { display: flex; align-items: center; gap: 8px; }
  .date-picker input { border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; outline: none; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; font-size: 12px; font-weight: 500; }
  .chip { border-radius: 999px; padding: 5px 11px; }
  .chip-present { background: var(--present-soft); color: var(--present); }
  .chip-absent { background: var(--absent-soft); color: var(--absent); }
  .chip-excused { background: var(--excused-soft); color: var(--excused); }
  .chip-neutral { background: rgba(0,0,0,0.05); color: var(--muted); }
  .chip-guest { background: var(--accent-soft); color: var(--accent); }
  .member-list { margin-top: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .member-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .member-row:last-child { border-bottom: none; }
  .member-name { font-size: 14px; font-weight: 500; color: var(--ink); }
  .leader-badge { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 7px; margin-left: 7px; vertical-align: middle; }
  .status-group { display: flex; gap: 6px; }
  .status-btn { border: 1px solid var(--border); background: #fff; color: var(--ink-soft); border-radius: 7px; padding: 6px 10px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .status-btn.active-present { background: var(--present); border-color: var(--present); color: #fff; }
  .status-btn.active-absent { background: var(--absent); border-color: var(--absent); color: #fff; }
  .status-btn.active-excused { background: var(--excused); border-color: var(--excused); color: #fff; }

  /* Reports */
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 18px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { padding: 9px 14px; font-size: 13.5px; font-weight: 500; border: none; background: #fff; color: var(--ink); cursor: pointer; }
  .seg button.active { background: var(--ink); color: #F6F7F1; }
  .controls select, .controls input[type=week], .controls input[type=month] { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: #fff; outline: none; }
  .range-label { font-size: 12px; color: var(--muted); margin-left: auto; }
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
  @media (min-width: 640px) { .summary-grid { grid-template-columns: repeat(4, 1fr); } }
  .summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
  .summary-label { font-size: 11.5px; color: var(--muted); }
  .summary-value { font-size: 22px; font-weight: 600; margin-top: 4px; }
  .chart-card { margin-top: 18px; }
  .chart-title { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
  .chart { display: flex; align-items: flex-end; gap: 8px; height: 160px; overflow-x: auto; padding-bottom: 4px; margin-top: 8px; }
  .bar-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; flex-shrink: 0; width: 26px; }
  .bar-stack { width: 100%; border-radius: 3px 3px 0 0; overflow: hidden; display: flex; flex-direction: column; }
  .bar-date { font-size: 9px; color: var(--muted); margin-top: 4px; }
  .report-canvas { width: 100%; height: auto; display: block; margin-top: 8px; }
  .table-card { margin-top: 18px; overflow: hidden; }
  .table-head { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .table-head-title { display: flex; align-items: center; gap: 8px; }
  .table-head h2 { font-size: 13.5px; font-weight: 600; color: var(--ink); font-family: inherit; }
  .table-search { position: relative; width: 190px; max-width: 100%; }
  .table-search svg { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .table-search input { width: 100%; padding: 6px 10px 6px 28px; border: 1px solid var(--border); border-radius: 7px; outline: none; font-size: 12.5px; }
  .no-rows-msg { padding: 16px; text-align: center; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-size: 11.5px; font-weight: 500; color: var(--muted); border-bottom: 1px solid var(--border); padding: 8px 12px; }
  th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  th.sortable:hover { color: var(--ink); }
  th.sort-active { color: var(--ink); font-weight: 700; }
  td { padding: 9px 12px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  .text-center { text-align: center; }
  .table-scroll { overflow-x: auto; }

  /* Modal / toast */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 60; }
  .modal { width: 100%; max-width: 360px; background: var(--surface); border-radius: 16px; padding: 22px; box-shadow: 0 10px 40px rgba(0,0,0,0.25); }
  .modal-title { display: flex; align-items: center; gap: 8px; color: var(--ink); margin-bottom: 4px; }
  .modal-title h2 { font-size: 17px; font-weight: 600; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #F6F7F1; padding: 10px 18px; border-radius: 999px; font-size: 13.5px; font-weight: 500; box-shadow: 0 6px 20px rgba(0,0,0,0.2); z-index: 70; }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ── Firebase REST API layer — shares the SAME Firebase project as the
//    Across Family Member Database, so EFAD's data is a real shared
//    database instead of per-device local storage. No SDK needed.
const FB_CONFIG = {
  apiKey:    "AIzaSyATJVh52EaXgVXS0PfDd69Vv2C-luhveI8",
  projectId: "across-family-ministry",
  authDomain:"across-family-ministry.firebaseapp.com",
};
const FSBASE   = `https://firestore.googleapis.com/v1/projects/${FB_CONFIG.projectId}/databases/(default)/documents`;
const AUTHBASE = `https://identitytoolkit.googleapis.com/v1`;

window._idToken = null;
window._refreshToken = null;
window._authUser = null;

// Session key is intentionally the SAME one the Membership Database uses
// (both apps live on the same origin), so signing in on one signs you
// into the other automatically.
function _saveSession(){
  try{
    localStorage.setItem('across_session', JSON.stringify({
      refreshToken: window._refreshToken,
      email: window._authUser ? window._authUser.email : null,
      uid: window._authUser ? window._authUser.uid : null
    }));
  }catch(e){}
}
async function _restoreSession(){
  let saved;
  try{ saved = JSON.parse(localStorage.getItem('across_session')||'null'); }catch(e){ saved = null; }
  if(!saved || !saved.refreshToken) return false;
  try{
    const r = await fetch(`https://securetoken.googleapis.com/v1/token?key=${FB_CONFIG.apiKey}`,{
      method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(saved.refreshToken)}`
    });
    const d = await r.json();
    if(d.error || !d.id_token) throw new Error('refresh failed');

    window._refreshToken = d.refresh_token;
    window._authUser = {email:saved.email, uid:saved.user_id||saved.uid};
    _saveSession();
    return true;
  } catch(e){
    try{ localStorage.removeItem('across_session'); }catch(e2){}

  }
}

// ── Firestore REST helpers (mirrors the Membership Database's pattern) ──
function _toFS(val){
  if(val === null || val === undefined) return {nullValue:null};
  if(typeof val === 'string')  return {stringValue: val};
  if(typeof val === 'number')  return {doubleValue: val};
  if(typeof val === 'boolean') return {booleanValue: val};
  if(Array.isArray(val))       return {arrayValue:{values: val.map(_toFS)}};
  if(typeof val === 'object')  return {mapValue:{fields: Object.fromEntries(Object.entries(val).map(([k,v])=>[k,_toFS(v)]))}};
  return {stringValue: String(val)};
}
function _fromFS(val){
  if(!val) return null;
  if('stringValue'  in val) return val.stringValue;
  if('integerValue' in val) return Number(val.integerValue);
  if('doubleValue'  in val) return Number(val.doubleValue);
  if('booleanValue' in val) return val.booleanValue;
  if('nullValue'    in val) return null;
  if('arrayValue'   in val) return (val.arrayValue.values||[]).map(_fromFS);
  if('mapValue'     in val) return Object.fromEntries(Object.entries(val.mapValue.fields||{}).map(([k,v])=>[k,_fromFS(v)]));
  return null;
}
function _docToObj(doc){
  const obj = {};
  for(const [k,v] of Object.entries(doc.fields||{})) obj[k] = _fromFS(v);
  obj.id = doc.name.split('/').pop();
  return obj;
}
async function _fsFetch(path, opts, token){
  const hdrs = Object.assign({'Content-Type':'application/json'}, (opts&&opts.headers)||{});
  if(token) hdrs['Authorization'] = 'Bearer ' + token;
  const r = await fetch(`${FSBASE}/${path}`, Object.assign({}, opts, {headers: hdrs}));
  return r.json();
}
window._db = {
  collection(col){
    return {
      async get(){
        const data = await _fsFetch(`${col}?pageSize=1000`, {}, window._idToken);
        const docs = (data.documents||[]).map(_docToObj);
        return {docs, empty: docs.length===0};
      },
      async add(obj){
        const fields = {};
        for(const [k,v] of Object.entries(obj)) fields[k] = _toFS(v);
        const data = await _fsFetch(col, {method:'POST', body:JSON.stringify({fields})}, window._idToken);
        if(data.error) throw new Error(data.error.message);
        return {id: (data.name||'').split('/').pop()};
      },
      doc(id){
        return {
          async update(obj){
            const fields = {};
            for(const [k,v] of Object.entries(obj)) fields[k] = _toFS(v);
            const mask = Object.keys(obj).map(k=>`updateMask.fieldPaths=${encodeURIComponent(k)}`).join('&');
            const data = await _fsFetch(`${col}/${id}?${mask}`, {method:'PATCH', body:JSON.stringify({fields})}, window._idToken);
            if(data.error) throw new Error(data.error.message);
          },
          async delete(){
            const data = await _fsFetch(`${col}/${id}`, {method:'DELETE'}, window._idToken);
            if(data && data.error) throw new Error(data.error.message);
          }
        };
      }
    };
  }
};

  /* ------------------------------------------------------
     Dashboard + Attendance
  ------------------------------------------------------ */
  function computeDashboardStats() {
    var groups = state.groups;
    var now = new Date();
    var todayStr = todayISO();

    var totalParticipants = groups.reduce(function (s, g) { return s + (g.leader ? 1 : 0) + (g.familyMemberCount || 0); }, 0);

    var entries = Object.keys(state.attendance).map(function (k) {
      var parts = k.split('__');
      return { groupId: parts[0], date: parts[1], records: state.attendance[k] };
    });

    function inRange(d, r) { return d >= r.start && d <= r.end; }

    var thisWeekRange = weekRange(isoWeekOf(now));
    var thisMonthRange = monthRange(defaultMonthValue());
    var thisYearRange = yearRangeFn(defaultYearValue());
    var last30Start = new Date(now); last30Start.setDate(last30Start.getDate() - 29);
    var last30Range = { start: toISO(last30Start), end: todayStr };

    function countSessions(range, groupId) {
      var set = {};
      entries.forEach(function (e) {
        if ((groupId && e.groupId !== groupId) || !inRange(e.date, range)) return;
        set[e.groupId + '__' + e.date] = true;
      });
      return Object.keys(set).length;
    }
    var sessionsThisWeek = countSessions(thisWeekRange);
    var sessionsThisMonth = countSessions(thisMonthRange);
    var sessionsThisYear = countSessions(thisYearRange);

    var groupsMetThisWeekSet = {};
    entries.forEach(function (e) { if (inRange(e.date, thisWeekRange)) groupsMetThisWeekSet[e.groupId] = true; });
    var groupsMetThisWeek = Object.keys(groupsMetThisWeekSet).length;

    var activeGroupIds = {};
    entries.forEach(function (e) { if (inRange(e.date, last30Range)) activeGroupIds[e.groupId] = true; });
    var activeDgroupsCount = Object.keys(activeGroupIds).length;

    var leaderCount = groups.filter(function (g) { return g.leader && g.leader.trim() !== ''; }).length;

    function periodStats(range, groupId) {
      var present = 0, marked = 0;
      entries.forEach(function (e) {
        if ((groupId && e.groupId !== groupId) || !inRange(e.date, range)) return;
        Object.keys(e.records).forEach(function (k) {
          if (k === '__familyPresent') { present += e.records[k]; marked += e.records[k]; }
          else if (k === '__familyAbsent' || k === '__familyExcused') { marked += e.records[k]; }
          else {
            var v = e.records[k];
            if (v === 'present') { present++; marked++; }
            else if (v === 'absent' || v === 'excused') { marked++; }
          }
        });
      });
      return { present: present, marked: marked, rate: marked > 0 ? Math.round((present / marked) * 100) : null };
    }

    var last14Start = new Date(now); last14Start.setDate(last14Start.getDate() - 13);
    var last14Range = { start: toISO(last14Start), end: todayStr };
    var lastMetByGroup = {};
    entries.forEach(function (e) {
      if (!lastMetByGroup[e.groupId] || e.date > lastMetByGroup[e.groupId]) lastMetByGroup[e.groupId] = e.date;
    });
    var followUps = [];
    groups.forEach(function (g) {
      var lastMet = lastMetByGroup[g.id];
      var daysSince = lastMet ? Math.floor((now - new Date(lastMet + 'T00:00:00')) / 86400000) : null;
      var noRecent = !lastMet || daysSince > 13;
      var s30 = periodStats(last30Range, g.id);
      var lowRate = s30.marked > 0 && s30.rate < 50;
      if (noRecent || lowRate) {
        var reason = lastMet ? (noRecent ? ('No session in ' + daysSince + ' days') : ('Attendance rate ' + s30.rate + '% in the last 30 days'))
          : 'No attendance recorded yet';
        followUps.push({ id: g.id, name: g.name, reason: reason });
      }
    });

    return {
      totalGroups: groups.length, activeDgroupsCount: activeDgroupsCount, totalParticipants: totalParticipants,
      leaderCount: leaderCount, groupsMetThisWeek: groupsMetThisWeek, sessionsThisWeek: sessionsThisWeek,
      sessionsThisMonth: sessionsThisMonth, sessionsThisYear: sessionsThisYear, followUps: followUps
    };
  }

    var famUnmarked = Math.max(0, famTotal - (fam.present + fam.absent + fam.excused));

    var counts = { present: 0, absent: 0, excused: 0, guest: 0 };
    roster.forEach(function (person) { if (counts[records[person.name]] !== undefined) counts[records[person.name]]++; });
    counts.present += fam.present; counts.absent += fam.absent; counts.excused += fam.excused; counts.guest += fam.guest;
    var leaderUnmarked = roster.filter(function (person) { return !records[person.name]; }).length;

        '<p class="muted" style="font-size:12.5px;margin-top:4px">Enter headcounts \u2014 no need to list individual names.</p>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">' +
        '<div class="field" style="width:100px"><label>Present</label><input type="number" id="family-present" min="0" step="1" value="' + fam.present + '"/></div>' +
        '<div class="field" style="width:100px"><label>Absent</label><input type="number" id="family-absent" min="0" step="1" value="' + fam.absent + '"/></div>' +
        '<div class="field" style="width:100px"><label>Excused</label><input type="number" id="family-excused" min="0" step="1" value="' + fam.excused + '"/></div>' +
        '<div class="field" style="width:100px"><label>Guests</label><input type="number" id="family-guest" min="0" step="1" value="' + fam.guest + '"/></div>' +
        '</div>' +
        '<p class="muted" style="font-size:12.5px;margin-top:10px">Unmarked: <span id="family-unmarked-live">' + famUnmarked + '</span> of ' + famTotal + '\u00a0\u00a0\u00b7\u00a0\u00a0Guests are visitors, not counted against the family total</p>' +
        '</div>'
      : '<div class="card" style="margin-top:14px"><p class="muted" style="font-size:13px">No family member count set for this Dgroup yet. Add one from the Admin Maintenance Menu.</p></div>';

    return '<div class="wrap">' +
      '<button class="btn-text" data-action="back-to-groups" style="display:flex;align-items:center;gap:6px;margin-bottom:14px">' + icon('back', 15) + ' Back to groups</button>' +

  /* ------------------------------------------------------
     Reports
  ------------------------------------------------------ */
  function reportsView() {
    var groups = state.groups;
    var rep = state.rep;
    var range = rep.period === 'weekly' ? weekRange(rep.week) : rep.period === 'monthly' ? monthRange(rep.month) : yearRangeFn(rep.year);

    var years = {}; years[new Date().getFullYear()] = true;
    Object.keys(state.attendance).forEach(function (k) { var d = k.split('__')[1]; if (d) years[Number(d.slice(0, 4))] = true; });
    var yearOptions = Object.keys(years).map(Number).sort(function (a, b) { return b - a; });

    var entries = Object.keys(state.attendance).map(function (k) {
      var parts = k.split('__');
      return { groupId: parts[0], date: parts[1], records: state.attendance[k] };
    }).filter(function (e) { return e.date >= range.start && e.date <= range.end; })
      .filter(function (e) { return rep.groupFilter === 'all' || e.groupId === rep.groupFilter; });

    var relevantGroups = rep.groupFilter === 'all' ? groups : groups.filter(function (g) { return g.id === rep.groupFilter; });

    var memberRows = [];
    relevantGroups.forEach(function (g) {
      getRoster(g).forEach(function (person) {
        var m = person.name;
        var present = 0, absent = 0, excused = 0;
        entries.filter(function (e) { return e.groupId === g.id; }).forEach(function (e) {
          var s = e.records[m];
          if (s === 'present') present++; else if (s === 'absent') absent++; else if (s === 'excused') excused++;
        });
        var marked = present + absent + excused;
        memberRows.push({ group: g.name, member: m, isLeader: person.isLeader, present: present, absent: absent, excused: excused, marked: marked, rate: marked > 0 ? Math.round((present / marked) * 100) : null, active: present > 0 });
      });
    });
    memberRows = sortRows(memberRows, rep.memberSort.key, rep.memberSort.dir, 'member');

    var groupRows = relevantGroups.map(function (g) {
      var mine = memberRows.filter(function (r) { return r.group === g.name; });
      var leaderPresent = mine.reduce(function (s, r) { return s + r.present; }, 0);
      var leaderAbsent = mine.reduce(function (s, r) { return s + r.absent; }, 0);
      var leaderExcused = mine.reduce(function (s, r) { return s + r.excused; }, 0);
      var famPresent = 0, famAbsent = 0, famExcused = 0, famGuest = 0;
      entries.filter(function (e) { return e.groupId === g.id; }).forEach(function (e) {
        famPresent += e.records.__familyPresent || 0;
        famAbsent += e.records.__familyAbsent || 0;
        famExcused += e.records.__familyExcused || 0;
        famGuest += e.records.__familyGuest || 0;
      });
      var present = leaderPresent + famPresent, absent = leaderAbsent + famAbsent, excused = leaderExcused + famExcused;
      var marked = present + absent + excused;
      return {
        id: g.id,
        name: g.name,
        familyMembers: g.familyMemberCount || 0,
        present: present, absent: absent, excused: excused, guests: famGuest,
        rate: marked > 0 ? Math.round((present / marked) * 100) : null
      };
    });
    groupRows = sortRows(groupRows, rep.groupSort.key, rep.groupSort.dir, 'name');

    var meetingsByGroup = relevantGroups.map(function (g) {
      var count = entries.filter(function (e) { return e.groupId === g.id; }).length;
      return { id: g.id, name: g.name, meetings: count };
    });

    var totalMembers = memberRows.length;
    var activeMembers = memberRows.filter(function (r) { return r.active; }).length;
    var sessionKeys = {}; entries.forEach(function (e) { sessionKeys[e.groupId + '__' + e.date] = true; });
    var sessionsHeld = Object.keys(sessionKeys).length;
    var totalPresent = memberRows.reduce(function (s, r) { return s + r.present; }, 0);
    var totalMarks = memberRows.reduce(function (s, r) { return s + r.marked; }, 0);
    var overallRate = totalMarks > 0 ? Math.round((totalPresent / totalMarks) * 100) : 0;

    var byDate = {};
    entries.forEach(function (e) {
      if (!byDate[e.date]) byDate[e.date] = { date: e.date, present: 0, absent: 0, excused: 0 };
      Object.keys(e.records).forEach(function (m) { var s = e.records[m]; if (byDate[e.date][s] !== undefined) byDate[e.date][s]++; });
    });
    var trendData = Object.keys(byDate).map(function (k) { return byDate[k]; }).sort(function (a, b) { return a.date.localeCompare(b.date); });

    var periodBtns = ['weekly', 'monthly', 'yearly'].map(function (p) {
      return '<button class="' + (rep.period === p ? 'active' : '') + '" data-action="set-period" data-period="' + p + '">' + p.charAt(0).toUpperCase() + p.slice(1) + '</button>';
    }).join('');

    var pickerHtml = '';
    if (rep.period === 'weekly') pickerHtml = '<input type="week" id="rep-week" value="' + rep.week + '"/>';
    else if (rep.period === 'monthly') pickerHtml = '<input type="month" id="rep-month" value="' + rep.month + '"/>';
    else pickerHtml = '<select id="rep-year">' + yearOptions.map(function (y) { return '<option value="' + y + '"' + (String(y) === rep.year ? ' selected' : '') + '>' + y + '</option>'; }).join('') + '</select>';

    var groupFilterHtml = '<select id="rep-group-filter"><option value="all"' + (rep.groupFilter === 'all' ? ' selected' : '') + '>All Dgroups</option>' +
      groups.map(function (g) { return '<option value="' + esc(g.id) + '"' + (rep.groupFilter === g.id ? ' selected' : '') + '>' + esc(g.name) + '</option>'; }).join('') + '</select>';

    var controls = '<div class="card controls"><div class="seg">' + periodBtns + '</div>' + pickerHtml + groupFilterHtml +
      '<span class="range-label">' + esc(range.label) + '</span></div>';

    var out = '<div class="wrap-lg">' +
      '<div style="display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px">' +
      '<div><h1 class="serif" style="font-size:24px;font-weight:600;color:var(--ink)">Attendance Report</h1>' +
      '<p class="muted" style="font-size:13.5px;margin-top:4px">See which members are actively attending EFAD.</p></div>' +
      '<button class="btn btn-ghost" data-action="export-excel" ' + (memberRows.length === 0 ? 'disabled' : '') + '>' + icon('download', 15) + ' Export Excel Report</button></div>' +
      controls;

    if (groups.length === 0) {
      out += emptyState('No Dgroups yet', 'Add groups and record attendance to see reports here.');
    } else {
      out += '<div class="summary-grid">' +
        summaryCard('Active Leaders', activeMembers + ' / ' + totalMembers, 'var(--present)') +
        summaryCard('Sessions Held', sessionsHeld, 'var(--ink)') +
        summaryCard('Overall Attendance', overallRate + '%', 'var(--accent)') +
        summaryCard('Dgroups Covered', relevantGroups.length, 'var(--ink)') + '</div>';

      out += '<div class="card chart-card"><div class="chart-title">' + icon('trend', 15) + ' Attendance per session</div>' +
        '<canvas id="chart-trend" class="report-canvas" width="600" height="220"></canvas></div>';

      out += '<div class="card chart-card"><div class="chart-title">' + icon('calendar', 15) + ' Meetings by Dgroup</div>' +
        '<canvas id="chart-by-group" class="report-canvas" width="600" height="260"></canvas></div>';

      out += topDgroupsCard(meetingsByGroup, rep.topN);

      out += '<div class="card table-card" style="padding:0"><div class="table-head"><span class="table-head-title">' + icon('bar', 15) + '<h2>By Dgroup \u2014 ' + esc(range.label) + '</h2></span>' +
        '<div class="table-search">' + icon('search', 14) + '<input type="text" id="search-group-table" placeholder="Search Dgroups" autocomplete="off"/></div></div>';
      if (groupRows.length === 0) {
        out += '<p class="muted" style="font-size:13.5px;text-align:center;padding:28px 0">No Dgroups to report on yet.</p>';

  /* Canvas-based stacked bar chart — used on-screen and captured as a PNG for the Excel export */
  function drawStackedBarChart(canvas, items, seriesKeys, seriesColors, seriesLabels, opts) {
    opts = opts || {};
    var ctx = canvas.getContext('2d');
    var W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, W, H);

    var padding = { top: 26, right: 14, bottom: opts.rotateLabels ? 62 : 34, left: 34 };
    var chartW = W - padding.left - padding.right;
    var chartH = H - padding.top - padding.bottom;

    var maxVal = 1;
    items.forEach(function (it) {
      var total = seriesKeys.reduce(function (s, k) { return s + (it[k] || 0); }, 0);
      if (total > maxVal) maxVal = total;
    });

    ctx.strokeStyle = '#DCE3E7'; ctx.lineWidth = 1;
    ctx.font = '10px Arial, sans-serif'; ctx.fillStyle = '#5C7386'; ctx.textAlign = 'right';
    var steps = 4;
    for (var s = 0; s <= steps; s++) {
      var y = padding.top + chartH - (chartH * (s / steps));
      ctx.beginPath(); ctx.moveTo(padding.left, y); ctx.lineTo(W - padding.right, y); ctx.stroke();
      ctx.fillText(String(Math.round(maxVal * (s / steps))), padding.left - 6, y + 3);
    }

    if (items.length === 0) {
      ctx.fillStyle = '#5C7386'; ctx.textAlign = 'center'; ctx.font = '12px Arial, sans-serif';
      ctx.fillText('No data for this period', W / 2, H / 2);
    } else {
      var n = items.length;
      var slot = chartW / n;
      var barW = Math.max(10, Math.min(30, slot * 0.55));
      items.forEach(function (it, idx) {
        var x = padding.left + idx * slot + (slot - barW) / 2;
        var yCursor = padding.top + chartH;
        seriesKeys.forEach(function (k, si) {
          var val = it[k] || 0;
          var h = (val / maxVal) * chartH;
          ctx.fillStyle = seriesColors[si];
          ctx.fillRect(x, yCursor - h, barW, h);
          yCursor -= h;
        });
        ctx.fillStyle = '#5C7386'; ctx.font = '9px Arial, sans-serif';
        var label = String(it.label);
        var maxChars = opts.rotateLabels ? 18 : 11;
        if (label.length > maxChars) label = label.slice(0, maxChars - 1) + '\u2026';
        if (opts.rotateLabels) {
          ctx.save();
          ctx.textAlign = 'right';
          ctx.translate(x + barW / 2, padding.top + chartH + 8);
          ctx.rotate(-Math.PI / 4);
          ctx.fillText(label, 0, 0);
          ctx.restore();
        } else {
          ctx.textAlign = 'center';
          ctx.fillText(label, x + barW / 2, padding.top + chartH + 14);
        }
      });
    }

    var lx = padding.left, ly = 14;
    ctx.font = '10px Arial, sans-serif'; ctx.textAlign = 'left';
    seriesKeys.forEach(function (k, si) {
      var lbl = seriesLabels[si];
      ctx.fillStyle = seriesColors[si];
      ctx.fillRect(lx, ly - 8, 8, 8);
      ctx.fillStyle = '#1F3C4D';
      ctx.fillText(lbl, lx + 12, ly);
      lx += ctx.measureText(lbl).width + 30;
    });
  }

  function handleHeroImageFile(file) {
    if (!/^image\//.test(file.type)) { flash('Please choose an image file'); return; }
    var reader = new FileReader();
    reader.onload = function (ev) {
      var img = new Image();
      img.onload = function () {
        var maxW = 1000;
        var scale = Math.min(1, maxW / img.width);
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        var dataUrl = canvas.toDataURL('image/jpeg', 0.82);
        persistHeroImage(dataUrl);
        flash('Dashboard photo updated');
        render();
      };
      img.onerror = function () { flash('Could not read that image'); };
      img.src = ev.target.result;
    };
    reader.onerror = function () { flash('Could not read that file'); };
    reader.readAsDataURL(file);
  }

  function captureStoryDraft() {
    var t = document.getElementById('story-title');
    var c = document.getElementById('story-category');
    var g = document.getElementById('story-group');
    var cap = document.getElementById('story-caption');
    if (!t && !c && !g && !cap) return;
    var prev = state.storyAdmin.draft || {};
    state.storyAdmin.draft = {
      title: t ? t.value : (prev.title || ''),
      category: c ? c.value : (prev.category || 'family'),
      groupId: g ? g.value : (prev.groupId || ''),
      caption: cap ? cap.value : (prev.caption || '')
    };

  function handleStoryImageFiles(fileList) {
    var files = Array.prototype.slice.call(fileList || []);
    var room = Math.max(0, 5 - state.storyAdmin.images.length);
    if (files.length > room) flash('You can add up to 5 photos per story (shared database storage limit)');
    files.slice(0, room).forEach(function (file) {
      if (!/^image\//.test(file.type)) return;
      var reader = new FileReader();
      reader.onload = function (ev) {
        var img = new Image();
        img.onload = function () {
          var maxW = 640;
          var scale = Math.min(1, maxW / img.width);
          var w = Math.max(1, Math.round(img.width * scale));
          var h = Math.max(1, Math.round(img.height * scale));
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d');

  function importBackupFile(file) {
    var reader = new FileReader();
    reader.onload = function (ev) {
      try {
        var data = JSON.parse(ev.target.result);
        if (!data || !Array.isArray(data.groups) || typeof data.attendance !== 'object' || data.attendance === null) {
          throw new Error('invalid');
        }
        persistGroups(data.groups);
        persistAttendance(data.attendance);
        if (typeof data.heroImage === 'string') persistHeroImage(data.heroImage);
        if (Array.isArray(data.stories)) persistStories(data.stories);
        flash('Backup imported into the shared database');
        render();
      } catch (e) {
        flash('That file doesn\u2019t look like a valid EFAD backup');
      }
    };
    reader.onerror = function () { flash('Could not read that file'); };
    reader.readAsText(file);
  }

  function buildXlsxWithExcelJS() {
    var d = lastReportData;

    var HEADER_FILL = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF5F7F8' } };

    /* Summary sheet: title, key stats, both charts as images */
    var summary = wb.addWorksheet('Summary');
    summary.getColumn(1).width = 14;
    summary.mergeCells('A1:F1');
    summary.getCell('A1').value = 'EFAD Attendance Report';
    summary.getCell('A1').font = { bold: true, size: 15, color: { argb: 'FF00416A' } };
    summary.mergeCells('A2:F2');

      summary.getCell('A' + imgRow).value = 'Attendance per session';
      summary.getCell('A' + imgRow).font = { bold: true };

    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'efad-attendance-report-' + range.start + '-to-' + range.end + '.xls';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function groupDetailModal() {
    var g = state.groups.filter(function (x) { return x.id === state.groupDetailId; })[0];
    if (!g) return '';
    var sessions = Object.keys(state.attendance).map(function (k) {
      var parts = k.split('__');
      return { groupId: parts[0], date: parts[1], records: state.attendance[k] };
    }).filter(function (e) { return e.groupId === g.id; }).sort(function (a, b) { return b.date.localeCompare(a.date); });

    var rows = sessions.map(function (e) {
      var leaderStatus = g.leader ? e.records[g.leader] : null;
      var present = (e.records.__familyPresent || 0) + (leaderStatus === 'present' ? 1 : 0);
      var absent = (e.records.__familyAbsent || 0) + (leaderStatus === 'absent' ? 1 : 0);
      var excused = (e.records.__familyExcused || 0) + (leaderStatus === 'excused' ? 1 : 0);
      var guest = e.records.__familyGuest || 0;
      return '<tr><td>' + esc(formatDateLabel(e.date)) + '</td><td class="text-center">' + present + '</td><td class="text-center">' + absent + '</td><td class="text-center">' + excused + '</td><td class="text-center">' + guest + '</td></tr>';
    }).join('');

    return '<div class="modal-backdrop"><div class="modal" style="max-width:480px;max-height:80vh;overflow-y:auto">' +
      '<div class="modal-title" style="justify-content:space-between"><span style="display:flex;align-items:center;gap:8px">' +

  /* ------------------------------------------------------
     Render
  ------------------------------------------------------ */
  function render() {
    var mainHtml = state.view === 'admin' && state.isAdmin ? adminView()
      : state.view === 'reports' ? reportsView()
      : state.view === 'stories' ? storiesView()
      : dashboardView();
    var html = '<div class="layout">' + sideNav() + '<main class="main">' + mainHtml + '</main></div>' +
      (state.loginOpen ? loginModal() : '') + (state.groupDetailId ? groupDetailModal() : '') + (state.lightbox ? lightboxModal() : '') + (state.toast ? toastHtml() : '');
    document.getElementById('app').innerHTML = html;
    wireLiveInputs();
    if (state.view === 'reports' && lastReportData) drawReportCharts(lastReportData);
    ensureStorySlideshow(state.view === 'stories');
  }

  function ensureStorySlideshow(active) {
    if (active) {
      if (!storySlideshowTimer) {
        storySlideshowTimer = setInterval(function () {
          if (state.view !== 'stories' || state.lightbox) return;
          var advanced = false;
          state.stories.forEach(function (s) {
            if (s.images && s.images.length > 1) {
              storyCarouselIndex[s.id] = ((storyCarouselIndex[s.id] || 0) + 1) % s.images.length;
              advanced = true;
            }
          });
          if (advanced) render();
        }, 3000);
      }
    } else if (storySlideshowTimer) {
      clearInterval(storySlideshowTimer);
      storySlideshowTimer = null;
    }
  }

  /* Live, non-rerendering input behaviors (avoid losing focus/cursor) */
  function wireLiveInputs() {
    var search = document.getElementById('dash-search');
    if (search) {
      search.addEventListener('input', function () {
        var q = search.value.trim().toLowerCase();
        var cards = document.querySelectorAll('#group-grid .group-card');
        var anyVisible = false;
        cards.forEach(function (card) {
          var match = !q || (card.getAttribute('data-search') || '').indexOf(q) !== -1;
          card.classList.toggle('hidden', !match);
          if (match) anyVisible = true;
        });
        var noMatch = document.getElementById('no-match-msg');
        if (noMatch) noMatch.classList.toggle('hidden', anyVisible || cards.length === 0);
      });
    }
    var famWrap = document.getElementById('family-tally-wrap');
    if (famWrap) {
      var famTotalVal = parseInt(famWrap.getAttribute('data-total'), 10) || 0;
      var pEl = document.getElementById('family-present');
      var aEl = document.getElementById('family-absent');
      var eEl = document.getElementById('family-excused');
      var liveEl = document.getElementById('family-unmarked-live');
      var recomputeFam = function () {
        var p = parseInt((pEl || {}).value, 10); if (isNaN(p) || p < 0) p = 0;
        var a = parseInt((aEl || {}).value, 10); if (isNaN(a) || a < 0) a = 0;
        var ex = parseInt((eEl || {}).value, 10); if (isNaN(ex) || ex < 0) ex = 0;
        var left = famTotalVal - (p + a + ex);
        if (left < 0) left = 0;
        if (liveEl) liveEl.textContent = left;
      };
      [pEl, aEl, eEl].forEach(function (el) { if (el) el.addEventListener('input', recomputeFam); });
    }
    var storySearch = document.getElementById('story-search');
    if (storySearch) {
      storySearch.addEventListener('input', function () {
        var q = storySearch.value.trim().toLowerCase();
        var cards = document.querySelectorAll('#story-grid .story-card');
        var anyVisible = false;
        cards.forEach(function (card) {
          var match = !q || (card.getAttribute('data-search') || '').indexOf(q) !== -1;
          card.classList.toggle('hidden', !match);
          if (match) anyVisible = true;
        });
        var noMatch = document.getElementById('story-no-match');
        if (noMatch) noMatch.classList.toggle('hidden', anyVisible || cards.length === 0);
      });
    }
    var groupTableSearch = document.getElementById('search-group-table');
    if (groupTableSearch) {
      groupTableSearch.addEventListener('input', function () {
        var q = groupTableSearch.value.trim().toLowerCase();
        var rows = document.querySelectorAll('#group-table-body tr');
        var anyVisible = false;
        rows.forEach(function (tr) {
          var match = !q || (tr.getAttribute('data-search') || '').indexOf(q) !== -1;
          tr.classList.toggle('hidden', !match);
          if (match) anyVisible = true;
        });
        var noMatch = document.getElementById('group-table-no-match');
        if (noMatch) noMatch.classList.toggle('hidden', anyVisible || rows.length === 0);
      });
    }
    var memberTableSearch = document.getElementById('search-member-table');
    if (memberTableSearch) {
      memberTableSearch.addEventListener('input', function () {
        var q = memberTableSearch.value.trim().toLowerCase();
        var rows = document.querySelectorAll('#member-table-body tr');
        var anyVisible = false;
        rows.forEach(function (tr) {
          var match = !q || (tr.getAttribute('data-search') || '').indexOf(q) !== -1;
          tr.classList.toggle('hidden', !match);
          if (match) anyVisible = true;
        });
        var noMatch = document.getElementById('member-table-no-match');
        if (noMatch) noMatch.classList.toggle('hidden', anyVisible || rows.length === 0);
      });
    }
    var pinInput = document.getElementById('login-pin');
    if (pinInput) {
      pinInput.focus();
      pinInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') submitLogin(); });
    }
  }

  /* ------------------------------------------------------
     Actions
  ------------------------------------------------------ */
  function submitLogin() {
    var email = (document.getElementById('login-email') || {}).value || '';
    var pass = (document.getElementById('login-password') || {}).value || '';
    if (!email.trim() || !pass) { state.loginError = 'Please enter email and password.'; render(); return; }
    state.loginError = '';
    _auth.signInWithEmailAndPassword(email.trim(), pass).then(function () {
      state.isAdmin = true;
      state.currentAdminEmail = window._authUser.email;
      state.loginOpen = false;
      state.loginError = '';
      state.view = 'admin';
      render();
    }).catch(function () {
      state.loginError = 'Invalid email or password.';
      render();
    });
  }

  function handleClick(e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');

    if (action === 'nav') {
      var view = el.getAttribute('data-view');
      if (view === 'admin' && !state.isAdmin) { state.loginError = ''; state.loginOpen = true; render(); return; }
      state.view = view; render(); return;
    }
    if (action === 'logout') {
      _auth.signOut();
      state.isAdmin = false; state.currentAdminEmail = null; state.view = 'dashboard'; flash('Signed out of Admin'); return;
    }
    if (action === 'login-submit') { submitLogin(); return; }
    if (action === 'login-cancel') { state.loginOpen = false; render(); return; }
    if (action === 'change-hero-image') { if (!state.isAdmin) return; var hf = document.getElementById('hero-image-file'); if (hf) hf.click(); return; }
    if (action === 'reset-hero-image') { persistHeroImage(null); flash('Reset to default photo'); render(); return; }

    if (action === 'select-group') { state.dash.selectedId = el.getAttribute('data-id'); render(); return; }
    if (action === 'back-to-groups') { state.dash.selectedId = null; state.att.groupId = null; render(); return; }

    if (action === 'set-status') {
      var g = state.groups.filter(function (x) { return x.id === state.att.groupId; })[0];
      if (!g) return;
      var member = getRoster(g)[Number(el.getAttribute('data-idx'))].name;
      var status = el.getAttribute('data-status');
      var records = state.att.records;
      if (records[member] === status) delete records[member]; else records[member] = status;
      state.att.dirty = true;
      render(); return;
    }
    if (action === 'save-attendance') {
      var gForSave = state.groups.filter(function (x) { return x.id === state.att.groupId; })[0];
      var famTotal = gForSave ? (gForSave.familyMemberCount || 0) : 0;
      var pv = parseInt((document.getElementById('family-present') || {}).value, 10); if (isNaN(pv) || pv < 0) pv = 0;
      var av = parseInt((document.getElementById('family-absent') || {}).value, 10); if (isNaN(av) || av < 0) av = 0;
      var ev = parseInt((document.getElementById('family-excused') || {}).value, 10); if (isNaN(ev) || ev < 0) ev = 0;
      var gv = parseInt((document.getElementById('family-guest') || {}).value, 10); if (isNaN(gv) || gv < 0) gv = 0;
      if (pv + av + ev > famTotal) { flash('Present + Absent + Excused can\u2019t add up to more than ' + famTotal + ' family members'); return; }
      var records = Object.assign({}, state.att.records, { __familyPresent: pv, __familyAbsent: av, __familyExcused: ev, __familyGuest: gv });
      state.att.records = records;
      var key = state.att.groupId + '__' + state.att.date;
      var next = Object.assign({}, state.attendance);
      next[key] = records;
      persistAttendance(next);
      state.att.dirty = false;
      flash('Attendance saved to this device');
      return;
    }

    if (action === 'set-period') { state.rep.period = el.getAttribute('data-period'); render(); return; }
    if (action === 'show-group-detail') { state.groupDetailId = el.getAttribute('data-id'); render(); return; }
    if (action === 'close-group-detail') { state.groupDetailId = null; render(); return; }
    if (action === 'sort-group') {
      var gKey = el.getAttribute('data-key');
      if (state.rep.groupSort.key === gKey) state.rep.groupSort.dir = state.rep.groupSort.dir === 'asc' ? 'desc' : 'asc';
      else { state.rep.groupSort.key = gKey; state.rep.groupSort.dir = 'asc'; }
      render(); return;
    }
    if (action === 'sort-member') {
      var mKey = el.getAttribute('data-key');
      if (state.rep.memberSort.key === mKey) state.rep.memberSort.dir = state.rep.memberSort.dir === 'asc' ? 'desc' : 'asc';
      else { state.rep.memberSort.key = mKey; state.rep.memberSort.dir = 'asc'; }
      render(); return;
    }
    if (action === 'export-excel') { exportExcelReport(); return; }

    if (action === 'admin-edit') { state.admin.editId = el.getAttribute('data-id'); state.admin.errors = {}; state.admin.photoData = null; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    if (action === 'admin-cancel-edit') { state.admin.editId = null; state.admin.errors = {}; state.admin.photoData = null; render(); return; }
    if (action === 'admin-delete-ask') { state.admin.confirmDeleteId = el.getAttribute('data-id'); render(); return; }
    if (action === 'admin-delete-no') { state.admin.confirmDeleteId = null; render(); return; }
    if (action === 'admin-delete-yes') {
      var id = el.getAttribute('data-id');
      persistGroups(state.groups.filter(function (g) { return g.id !== id; }));
      state.admin.confirmDeleteId = null;
      if (state.admin.editId === id) state.admin.editId = null;
      flash('Dgroup removed');
      return;
    }
    if (action === 'admin-submit') { submitAdminForm(); return; }
    if (action === 'group-upload-photo') { var gf = document.getElementById('group-image-file'); if (gf) gf.click(); return; }
    if (action === 'group-remove-photo') { state.admin.photoData = ''; render(); return; }
    if (action === 'export-backup') { exportBackup(); return; }
    if (action === 'import-backup') { var fi = document.getElementById('import-file'); if (fi) fi.click(); return; }

    if (action === 'story-edit') {
      state.storyAdmin.editId = el.getAttribute('data-id');
      state.storyAdmin.errors = {};
      state.storyAdmin.draft = null;
      var editingStory = state.stories.filter(function (s) { return s.id === state.storyAdmin.editId; })[0];
      state.storyAdmin.images = editingStory && Array.isArray(editingStory.images) ? editingStory.images.slice() : [];
      render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return;
    }
    if (action === 'story-cancel-edit') { state.storyAdmin.editId = null; state.storyAdmin.errors = {}; state.storyAdmin.images = []; state.storyAdmin.draft = null; render(); return; }
    if (action === 'story-delete-ask') { state.storyAdmin.confirmDeleteId = el.getAttribute('data-id'); render(); return; }
    if (action === 'story-delete-no') { state.storyAdmin.confirmDeleteId = null; render(); return; }
    if (action === 'story-delete-yes') {
      var storyDelId = el.getAttribute('data-id');
      persistStories(state.stories.filter(function (s) { return s.id !== storyDelId; }));
      state.storyAdmin.confirmDeleteId = null;
      if (state.storyAdmin.editId === storyDelId) { state.storyAdmin.editId = null; state.storyAdmin.images = []; state.storyAdmin.draft = null; }
      flash('Story removed');
      return;
    }
    if (action === 'story-upload-photo') { var sf = document.getElementById('story-image-file'); if (sf) sf.click(); return; }
    if (action === 'story-remove-image') {
      var rmIdx = Number(el.getAttribute('data-idx'));
      state.storyAdmin.images.splice(rmIdx, 1);
      captureStoryDraft();
      render(); return;
    }
    if (action === 'story-submit') { submitStoryForm(); return; }
    if (action === 'story-carousel-next') {
      var sidN = el.getAttribute('data-id');
      var storyN = state.stories.filter(function (s) { return s.id === sidN; })[0];
      if (storyN && storyN.images && storyN.images.length > 0) {
        storyCarouselIndex[sidN] = ((storyCarouselIndex[sidN] || 0) + 1) % storyN.images.length;
        render();
      }
      return;
    }
    if (action === 'story-carousel-prev') {
      var sidP = el.getAttribute('data-id');
      var storyP = state.stories.filter(function (s) { return s.id === sidP; })[0];
      if (storyP && storyP.images && storyP.images.length > 0) {
        storyCarouselIndex[sidP] = ((storyCarouselIndex[sidP] || 0) - 1 + storyP.images.length) % storyP.images.length;
        render();
      }
      return;
    }
    if (action === 'open-lightbox') {
      var lbId = el.getAttribute('data-id');
      var lbIdx = Number(el.getAttribute('data-idx')) || 0;
      state.lightbox = { storyId: lbId, index: lbIdx };
      render(); return;
    }
    if (action === 'close-lightbox') { state.lightbox = null; render(); return; }
    if (action === 'lightbox-next') {
      var lbStoryN = state.stories.filter(function (s) { return s.id === state.lightbox.storyId; })[0];
      if (lbStoryN && lbStoryN.images && lbStoryN.images.length > 0) {
        state.lightbox.index = (state.lightbox.index + 1) % lbStoryN.images.length;
        render();
      }
      return;
    }
    if (action === 'lightbox-prev') {
      var lbStoryP = state.stories.filter(function (s) { return s.id === state.lightbox.storyId; })[0];
      if (lbStoryP && lbStoryP.images && lbStoryP.images.length > 0) {
        state.lightbox.index = (state.lightbox.index - 1 + lbStoryP.images.length) % lbStoryP.images.length;
        render();
      }
      return;
    }
    if (action === 'lightbox-noop') { return; }
  }

  function submitAdminForm() {
    var name = (document.getElementById('admin-name') || {}).value || '';
    var leader = (document.getElementById('admin-leader') || {}).value || '';
    var schedule = (document.getElementById('admin-schedule') || {}).value || '';
    var countRaw = (document.getElementById('admin-member-count') || {}).value || '';

    var errors = {};
    if (!name.trim()) errors.name = 'Dgroup name is required.';
    if (!leader.trim()) errors.leader = 'Discipleship leader is required.';
    if (SCHEDULE_OPTIONS.indexOf(schedule) === -1) errors.schedule = 'Choose a schedule.';
    var count = parseInt(countRaw, 10);
    if (countRaw.trim() === '' || isNaN(count) || count < 0) errors.familyMemberCount = 'Enter a valid number (0 or more).';
    state.admin.errors = errors;
    if (Object.keys(errors).length > 0) { render(); return; }

    var editing = state.admin.editId !== null;
    var existing = editing ? state.groups.filter(function (g) { return g.id === state.admin.editId; })[0] : null;
    var photo = state.admin.photoData === '' ? null : (state.admin.photoData || (existing ? existing.photo : null));
    var payload = {
      id: state.admin.editId || uid(),
      name: name.trim().toUpperCase(),
      type: 'EFAD',
      schedule: schedule,
      leader: leader.trim().toUpperCase(),
      familyMemberCount: count,
      photo: photo,
      members: existing && Array.isArray(existing.members) ? existing.members : []
    };
    var next = editing ? state.groups.map(function (g) { return g.id === payload.id ? payload : g; }) : state.groups.concat([payload]);
    persistGroups(next);
    state.admin.editId = null;
    state.admin.errors = {};
    state.admin.photoData = null;
    flash(editing ? 'Dgroup updated' : 'Dgroup added');
  }

  function submitStoryForm() {
    var title = (document.getElementById('story-title') || {}).value || '';
    var category = (document.getElementById('story-category') || {}).value || 'family';
    var groupId = (document.getElementById('story-group') || {}).value || '';
    var caption = (document.getElementById('story-caption') || {}).value || '';

    var errors = {};
    if (!title.trim()) errors.title = 'Title is required.';
    if (!caption.trim()) errors.caption = 'Story/update text is required.';
    state.storyAdmin.errors = errors;
    if (Object.keys(errors).length > 0) {
      state.storyAdmin.draft = { title: title, category: category, groupId: groupId, caption: caption };
      render(); return;
    }

    var editing = state.storyAdmin.editId !== null;
    var existing = editing ? state.stories.filter(function (s) { return s.id === state.storyAdmin.editId; })[0] : null;
    var payload = {
      id: editing ? existing.id : uid(),
      title: title.trim(),
      category: category,
      groupId: groupId || null,
      caption: caption.trim(),
      images: state.storyAdmin.images.slice(),
      date: existing ? existing.date : todayISO(),
      createdAt: existing ? existing.createdAt : new Date().toISOString()
    };
    var next = editing ? state.stories.map(function (s) { return s.id === payload.id ? payload : s; }) : state.stories.concat([payload]);
    persistStories(next);
    state.storyAdmin.editId = null;
    state.storyAdmin.errors = {};
    state.storyAdmin.images = [];
    state.storyAdmin.draft = null;
    flash(editing ? 'Story updated' : 'Story added');
  }

  function handleChange(e) {
    var t = e.target;
    if (t.id === 'hero-image-file') {
      var imgFile = t.files && t.files[0];
      t.value = '';
      if (imgFile) handleHeroImageFile(imgFile);
      return;
    }
    if (t.id === 'story-image-file') {
      var storyImgFiles = Array.prototype.slice.call(t.files || []);
      t.value = '';
      if (storyImgFiles.length) handleStoryImageFiles(storyImgFiles);
      return;
    }
    if (t.id === 'group-image-file') {
      var groupImgFile = t.files && t.files[0];
      t.value = '';
      if (groupImgFile) handleGroupImageFile(groupImgFile);
      return;
    }
    if (t.id === 'import-file') {
      var file = t.files && t.files[0];
      t.value = '';
      if (file) importBackupFile(file);
      return;
    }
    if (t.id === 'att-date') {
      state.att.date = t.value;
      state.att.records = state.attendance[state.att.groupId + '__' + t.value] || {};
      state.att.dirty = false;
      render(); return;
    }
    if (t.id === 'rep-week') { state.rep.week = t.value; render(); return; }
    if (t.id === 'rep-month') { state.rep.month = t.value; render(); return; }
    if (t.id === 'rep-year') { state.rep.year = t.value; render(); return; }
    if (t.id === 'rep-group-filter') { state.rep.groupFilter = t.value; render(); return; }
    if (t.id === 'rep-topn') { state.rep.topN = t.value; render(); return; }
  }

  document.addEventListener('click', handleClick);
  document.addEventListener('change', handleChange);

  function connectingScreen() {
    return '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--muted);font-size:13.5px">' +
      '<div class="serif" style="font-size:18px;color:var(--ink);font-weight:600">EFAD Attendance Tracker</div>' +
      '<div>Connecting to the shared database\u2026</div></div>';
  }

  async function boot() {
    document.getElementById('app').innerHTML = connectingScreen();

    var restored = false;
    try { restored = await _restoreSession(); } catch (e) { restored = false; }

    try {
      var groupsSnap = await _db.collection('efad_groups').get();
      state.groups = groupsSnap.docs.map(function (g) {
        if (typeof g.familyMemberCount !== 'number') {
          g.familyMemberCount = Array.isArray(g.members) ? g.members.length : 0;
        }
        if (!Array.isArray(g.members)) g.members = [];
        return g;
      });
    } catch (e) { console.error('Could not load Dgroups', e); }

    try {
      var attSnap = await _db.collection('efad_attendance').get();
      var attObj = {};
      attSnap.docs.forEach(function (d) {
        var key = d.id; var records = {};
        Object.keys(d).forEach(function (k) { if (k !== 'id') records[k] = d[k]; });
        attObj[key] = records;
      });
      state.attendance = attObj;
    } catch (e) { console.error('Could not load attendance', e); }

    try {
      var storiesSnap = await _db.collection('efad_stories').get();
      state.stories = storiesSnap.docs.map(function (s) {
        if (!Array.isArray(s.images)) s.images = s.image ? [s.image] : [];
        return s;
      });
    } catch (e) { console.error('Could not load stories', e); }

    try {
      var heroSnap = await _fsFetch('efad_settings/hero', {}, window._idToken);
      if (!heroSnap.error) { var heroObj = _docToObj(heroSnap); state.heroImage = heroObj.image || null; }
    } catch (e) { /* no hero photo set yet */ }

    if (restored && window._authUser) {
      state.isAdmin = true;
      state.currentAdminEmail = window._authUser.email;
    }

    render();
  }

  boot();
})();
</script>
</body>
</html>
